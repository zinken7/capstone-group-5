name: Seed staging database

# Manual only: the seed populates an empty staging database and is never part
# of a deployment. Only main can use the staging environment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-staging:
    name: Migrate and seed staging database
    runs-on: ubuntu-latest
    environment: staging
    # Shared with the migrate-staging job in lint.yml.
    concurrency:
      group: staging-database
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::STAGING_DATABASE_URL is not set in the staging environment'
            exit 1
          fi
      - name: Apply pending migrations
        run: npm run db:migrate
      - name: Load the seed dataset
        run: npm run db:seed
