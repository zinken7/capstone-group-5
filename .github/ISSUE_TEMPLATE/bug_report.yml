name: Bug Report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Please provide enough information for the team to reproduce and investigate the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Enter ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, deployment environment, etc.
      placeholder: "Example: Chrome 150, macOS, local development"

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add screenshots, logs, or other useful evidence.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other relevant information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues before creating this issue.
          required: true
        - label: I have removed any sensitive information from logs or screenshots.
          required: true